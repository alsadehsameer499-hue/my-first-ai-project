<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام متابعة الأعمال</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>📋 نظام متابعة الأعمال</h1>
        <p>متابعة الأعمال والمهام والإنجازات</p>
    </header>

    <main>

        <!-- إضافة مهمة -->
        <section class="card">

            <h2>إضافة عمل جديد</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="اكتب اسم العمل أو المهمة"
            >

            <button id="addTaskBtn">
                إضافة العمل
            </button>

        </section>


        <!-- أدوات متقدمة: بحث، تصفية، ترتيب، تصدير/استيراد -->
        <section class="card">
            <h2>أدوات</h2>

            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                <input id="searchInput" type="search" placeholder="ابحث عن مهمة..." aria-label="بحث">

                <label for="filterSelect">حالة:</label>
                <select id="filterSelect">
                    <option value="all">الكل</option>
                    <option value="pending">قيد التنفيذ</option>
                    <option value="completed">منجزة</option>
                </select>

                <label for="sortSelect">ترتيب:</label>
                <select id="sortSelect">
                    <option value="date_desc">الأحدث أولاً</option>
                    <option value="date_asc">الأقدم أولاً</option>
                    <option value="name_asc">اسم (أ-ي)</option>
                    <option value="name_desc">اسم (ي-أ)</option>
                </select>

                <button id="markAllBtn">وضع كل المهام كمنجزة</button>
                <button id="clearCompletedBtn">مسح المنجزة</button>
                <button id="exportBtn">تصدير JSON</button>
                <label class="import-label" for="importFile">استيراد</label>
                <input id="importFile" type="file" accept="application/json" style="display:none">
            </div>

            <p style="margin-top:10px;color:#555;font-size:14px">نصيحة: استخدم التصدير لعمل نسخة احتياطية أو النقل إلى جهاز آخر.</p>
        </section>


        <!-- الإحصائيات -->
        <section class="stats">

            <div class="stat">
                <h3 id="totalTasks">0</h3>
                <p>إجمالي الأعمال</p>
            </div>

            <div class="stat">
                <h3 id="completedTasks">0</h3>
                <p>الأعمال المنجزة</p>
            </div>

            <div class="stat">
                <h3 id="pendingTasks">0</h3>
                <p>الأعمال المتبقية</p>
            </div>

        </section>


        <!-- نسبة الإنجاز -->
        <section class="card">

            <h2>نسبة الإنجاز</h2>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <p id="progressText">0%</p>

        </section>


        <!-- قائمة الأعمال -->
        <section class="card">

            <h2>الأعمال والمهام</h2>

            <div id="taskList"></div>

        </section>

    </main>


    <footer>
        <p>نظام متابعة الأعمال © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
