<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام متابعة الأعمال</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📋 نظام متابعة الأعمال</h1>
        <p>متابعة الأعمال والمهام والإنجازات</p>
    </header>

    <main>

        <!-- إضافة مهمة -->
        <section class="card">

            <h2>إضافة عمل جديد</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="اكتب اسم العمل أو المهمة"
            >

            <button onclick="addTask()">
                إضافة العمل
            </button>

        </section>


        <!-- الإحصائيات -->
        <section class="stats">

            <div class="stat">
                <h3 id="totalTasks">0</h3>
                <p>إجمالي الأعمال</p>
            </div>

            <div class="stat">
                <h3 id="completedTasks">0</h3>
                <p>الأعمال المنجزة</p>
            </div>

            <div class="stat">
                <h3 id="pendingTasks">0</h3>
                <p>الأعمال المتبقية</p>
            </div>

        </section>


        <!-- نسبة الإنجاز -->
        <section class="card">

            <h2>نسبة الإنجاز</h2>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <p id="progressText">0%</p>

        </section>


        <!-- قائمة الأعمال -->
        <section class="card">

            <h2>الأعمال والمهام</h2>

            <div id="taskList"></div>

        </section>

    </main>


    <footer>
        <p>نظام متابعة الأعمال © 2026</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
