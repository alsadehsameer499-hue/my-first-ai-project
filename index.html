<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الأعمال</title>
</head>

<body>

    <h1>نظام متابعة الأعمال</h1>

    <p>متابعة الأعمال والمهام والإنجازات</p>

    <section>
        <h2>إضافة متابعة جديدة</h2>

        <input id="title" type="text" placeholder="موضوع المتابعة">

        <input id="responsible" type="text" placeholder="المسؤول">

        <input id="date" type="date">

        <select id="status">
            <option value="new">جديد</option>
            <option value="progress">قيد المتابعة</option>
            <option value="completed">مكتمل</option>
            <option value="late">متأخر</option>
        </select>

        <button id="save-btn">حفظ المتابعة</button>
    </section>
    <section>
        <h2>المتابعات المسجلة</h2>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>موضوع المتابعة</th>
                    <th>المسؤول</th>
                    <th>التاريخ</th>
                    <th>الحالة</th>
                </tr>
            </thead>

            <tbody id="followups-list">
            </tbody>
        </table>
    </section>
<script src="app.js"></script>
</body>
